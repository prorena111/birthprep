<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>출산펭귄 — 살 것 목록</title>
<meta property="og:title" content="출산펭귄 — 살 것 목록">
<meta property="og:description" content="품목마다 쿠팡에서 바로 볼 수 있어요.">
<!--
  카카오톡으로 받은 「살 것 목록」의 「쿠팡 링크 보기」 단추가 여는 쪽(앱의
  ListShare.shoppingKakao). 카카오톡 메시지는 단추가 둘까지라 품목 서른 개의
  링크를 다 못 단다 — 그래서 이 쪽이 품목마다 링크를 보여 준다.

  주소: https://prorena111.github.io/birthprep/buy.html?i=C1-03.C2-05
  - 품목 이름은 items.json(앱 카탈로그에서 뽑음 — test/buy_page_test.dart가 대조),
    쿠팡 파트너스 링크는 v1/data.json의 coupang 표(매달 작업이 고친다)에서 id로 찾는다.
  - **주소를 실어 보내지 않는다.** 우리 도메인에서 아무 주소나 열리게 하면 안 된다.
  - **저절로 쿠팡으로 넘기지 않는다** — 사람이 눌러야 연다(파트너스 강제 클릭 금지).
  - 대가성 문구는 링크보다 먼저(쿠팡 이용약관 제12조④·공정위 심사지침).
  원본은 앱 저장소 docs/pages/buy.html.
-->
<style>
  :root { --ink: #1a1a1a; --soft: #555; --bg: #fffdf2; --yellow: #ffe500; --red: #e8412c; --line: #1a1a1a; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; line-height: 1.6; }
  header { background: var(--yellow); border-bottom: 2.5px solid var(--line); padding: 18px 16px; }
  header h1 { margin: 0 auto; max-width: 640px; font-size: 22px; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 16px 32px; }
  .notice { font-size: 13px; color: var(--soft); background: #fff; border: 1.5px solid var(--line); border-radius: 6px; padding: 10px 12px; margin: 12px 0; }
  .how { font-size: 15px; font-weight: 700; margin: 14px 0 8px; }
  ul { list-style: none; padding: 0; margin: 0; background: #fff; border: 2px solid var(--line); border-radius: 8px; }
  li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; min-height: 48px; border-top: 1.5px solid #ddd; }
  li:first-child { border-top: 0; }
  li .name { flex: 1; font-size: 17px; font-weight: 700; }
  li.seen .name { color: #888; }
  li .seen-mark { font-size: 12px; color: #888; font-weight: 700; display: none; }
  li.seen .seen-mark { display: inline; }
  .go { flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; background: var(--yellow); color: var(--ink); font-weight: 800; font-size: 15px; text-decoration: none; border: 2px solid var(--line); border-radius: 6px; }
  li.seen .go { background: #eee; }
  .empty { padding: 24px 12px; text-align: center; color: var(--soft); }
  .app { display: block; text-align: center; background: var(--red); color: #fff; font-weight: 800; font-size: 17px; text-decoration: none; border: 2px solid var(--line); border-radius: 10px; padding: 13px 16px; margin-top: 18px; }
  .soft { color: var(--soft); font-size: 13px; }
  a { color: #0b57d0; }
</style>
</head>
<body>
<header><h1>🛒 살 것 목록 <span id="count"></span></h1></header>
<main>
  <p class="notice">※ 쿠팡 파트너스 활동의 일환으로 일정액의 수수료를 제공받아요.<br>
  수수료는 쿠팡이 부담하고, 직접 쿠팡앱에서 사는 것과 가격은 같아요.</p>

  <p class="how">하나씩 눌러 쿠팡에서 「장바구니 담기」를 누르고, 뒤로 돌아오면 다음 것이 보여요.</p>
  <ul id="list"><li class="empty">불러오는 중…</li></ul>

  <a class="app" href="https://play.google.com/store/apps/details?id=kr.birthprep.allinone">출산펭귄 받기 — 시기별로 뭘 사고 뭘 안 사도 되는지</a>
  <p class="soft">값과 상품은 쿠팡에서 확인해 주세요. 출산펭귄이 고른 상품이 아니라 쿠팡의 검색 결과(많이 팔린 순·랭킹순)로 열려요.
  <a href="privacy.html">개인정보처리방침</a> · <a href="./">출산펭귄 홈</a></p>
</main>
<script>
  var list = document.getElementById('list');
  var params = new URLSearchParams(location.search);
  var seen = {};
  var ids = [];
  (params.get('i') || '').split('.').forEach(function (id) {
    if (/^C\d{1,2}-\d{2}$/.test(id) && !seen[id] && ids.length < 300) { seen[id] = 1; ids.push(id); }
  });

  // 이 폰에서 이미 연 품목 — 돌아왔을 때 어디까지 했는지 보이게. 이 브라우저에만.
  var opened = {};
  try { opened = JSON.parse(localStorage.getItem('opened') || '{}') || {}; } catch (e) {}
  function remember(id) {
    opened[id] = 1;
    try { localStorage.setItem('opened', JSON.stringify(opened)); } catch (e) {}
  }

  function coupangOf(data, id, name) {
    var link = data && data.coupang && data.coupang[id];
    if (typeof link === 'string' && /^https:\/\/link\.coupang\.com\//.test(link)) return link;
    // 파트너스 링크가 아직 없는 품목은 쿠팡 검색으로(수수료 없음).
    return 'https://www.coupang.com/np/search?q=' + encodeURIComponent(name);
  }

  function show(names, data) {
    list.innerHTML = '';
    var shown = 0;
    ids.forEach(function (id) {
      var name = names[id];
      if (typeof name !== 'string') return;
      shown++;
      var li = document.createElement('li');
      if (opened[id]) li.className = 'seen';
      var label = document.createElement('span');
      label.className = 'name';
      label.textContent = name + ' ';
      var mark = document.createElement('span');
      mark.className = 'seen-mark';
      mark.textContent = '열어 봤어요';
      label.appendChild(mark);
      var go = document.createElement('a');
      go.className = 'go';
      go.href = coupangOf(data, id, name);
      go.rel = 'sponsored noopener';
      go.textContent = '쿠팡에서 보기 ›';
      go.addEventListener('click', function () { remember(id); li.className = 'seen'; });
      li.appendChild(label);
      li.appendChild(go);
      list.appendChild(li);
    });
    document.getElementById('count').textContent = shown ? shown + '개' : '';
    if (!shown) list.innerHTML = '<li class="empty">보낼 품목이 없어요. 보낸 사람에게 다시 보내 달라고 해 주세요.</li>';
  }

  function json(url) {
    return fetch(url, { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
  }

  Promise.all([json('items.json'), json('v1/data.json')]).then(function (got) {
    if (!got[0]) { list.innerHTML = '<li class="empty">목록을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</li>'; return; }
    show(got[0], got[1]);
  });
</script>
</body>
</html>

# 매달 1일 데이터 갱신 — 사람이 누를 것이 없다.
#
#   1) 정부24에서 나라·지자체(시·도·시군구)의 임신·출산·육아 지원을 받아
#      v1/local.json을 새로 쓴다. 앱은 하루 한 번 v1/data.json을 보다가 새 목록이
#      있으면 내려받는다.
#   2) 앱이 금액까지 보여 주는 나라 제도 여덟 가지의 정부24 글이 사람이 확인한
#      글과 같은지 본다. 같으면 v1/data.json의 확인 시점을 이번 달로 올리고,
#      다르면 tool/central_changes.md에 전·후를 적고 이 실행을 실패로 끝내
#      저장소 주인에게 메일이 가게 한다.
#   3) tool/coupang_urls.tsv에 있는데 파트너스 링크가 없는 품목을 바꿔
#      v1/data.json에 넣는다(한 번 만든 링크는 기한이 없다).
#
# 코드는 tool/*.dart — 원본은 앱 저장소의 tool/monthly/이고 여기는 사본이다.
# 키는 Settings → Secrets and variables → Actions에 넣는다(코드에 적지 않는다):
#   DATA_GO_KR_KEY       공공데이터포털 「일반 인증키(Decoding)」
#   COUPANG_ACCESS_KEY   쿠팡 파트너스 Access Key
#   COUPANG_SECRET_KEY   쿠팡 파트너스 Secret Key
name: 매달 데이터 갱신

on:
  schedule:
    - cron: '17 0 1 * *' # 매달 1일 09:17(한국 시각)
  workflow_dispatch:
    inputs:
      accept:
        description: '확인을 마친 나라 제도 번호(예: S04, 전부면 all). 그냥 갱신하려면 비워 두세요.'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['tool/coupang_urls.tsv'] # 새 품목 주소를 올리면 링크만 바로 만든다

permissions:
  contents: write # 갱신한 파일을 올린다
  pages: write # 올린 뒤 웹 페이지를 다시 만든다

concurrency:
  group: monthly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1

      - name: 패키지
        working-directory: tool
        run: dart pub get

      - name: 갱신
        id: run
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          ACCEPT: ${{ github.event.inputs.accept }}
          ONLY_COUPANG: ${{ github.event_name == 'push' }}
        run: dart --packages=tool/.dart_tool/package_config.json tool/monthly.dart --root .

      - name: 올리기
        id: push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v1 tool
          if git diff --cached --quiet; then
            echo '바뀐 것 없음'
            exit 0
          fi
          git commit -m "매달 데이터 갱신 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'pushed=true' >> "$GITHUB_OUTPUT"

      # 이 작업의 토큰으로 올린 것은 웹 페이지를 저절로 다시 만들지 않는다
      # (GitHub 문서). 그래서 한 번 불러 준다.
      - name: 웹 페이지 다시 만들기
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"

      - name: 사람이 볼 것이 있으면 알림
        if: steps.run.outputs.attention == 'true'
        run: |
          echo '::error::사람이 확인할 것이 있습니다 — 이 실행의 Summary와 tool/central_changes.md를 보세요.'
          exit 1
